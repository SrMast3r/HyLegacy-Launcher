jobs:
  #if true, the default jobs are enabled. WARNING: setting this to false will erase all the stats for these jobs
  #Default value: true
  enable_default_jobs: true
  #the amount of free jobs a player can have
  #Minimum value: 0, Maximum value: 2147483647, Default value: 2
  amount_of_free_jobs: 2
  #the maximum amount of jobs a player can have
  #Minimum value: 0, Maximum value: 2147483647, Default value: 2147483647
  max_jobs: 2147483647
  #A list of job IDs to exclude from the game. Example: ['jobsplus:miner', 'jobsplus:digger']
  #Default value: []
  excluded_jobs: []
  #The formula used to calculate experience required for the next level.
  #Default value: '100 + level * level * 0.5791'
  experience_formula: '100 + level * level * 0.5791'
  #A global multiplier for all job prices.
  #Minimum value: 0.0, Maximum value: 100.0, Default value: 1.0
  job_price_multiplier: 1.0
  #if true, a message will be shown to all players when they level up a job
  #Default value: true
  broadcast_level_up_messages: true
  powerups:
    #A global multiplier for all powerup prices.
    #Minimum value: 0.0, Maximum value: 100.0, Default value: 1.0
    powerup_price_multiplier: 1.0
    #A list of powerup IDs to exclude from the game. Example: ['jobsplus:miner/double_drops_iii', 'jobsplus:digger/shovel_efficiency_v']
    #Default value: []
    excluded_powerups: []
  experience:
    #multiplier for the amount of job XP a player gains
    #Minimum value: 0.0, Maximum value: 1.7976931348623157E308, Default value: 1.0
    xp_multiplier: 1.0
    #if true, decimal values will be used for job XP.
    #Default value: false
    use_decimal_values_for_xp: false
    #If true, players will lose a percentage of their job experience upon death.
    #Default value: false
    lose_exp_on_death: false
    #The percentage of experience lost on death (0.25 = 25%).
    #Minimum value: 0.0, Maximum value: 1.0, Default value: 0.25
    exp_loss_percentage: 0.25
  coins:
    #the amount of coins a player gets when they level up a job
    #Minimum value: 0.0, Maximum value: 1.7976931348623157E308, Default value: 1.0
    coins_per_level_up: 1.0
display:
  #The format used to display coins.
  #Uses DecimalFormat patterns.
  #Examples: '#,##0.00', '0.0a', '##0‰'
  #Minimum length: 1, Maximum length: 32, Default value: '#,###.#'
  coin_format: '#,###.#'
  #The format used to display experience.
  #Uses DecimalFormat patterns.
  #Examples: '#,##0.00', '0.0a', '##0‰'
  #Minimum length: 1, Maximum length: 32, Default value: '#,###.#'
  exp_format: '#,###.#'
debug:
  #if true, debug mode is enabled
  #Default value: false
  is_debug: false
