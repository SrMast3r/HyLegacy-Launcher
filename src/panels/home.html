<div class="home container">
    <!-- TOP: estado servidor centrado -->
    <div class="status-server" role="status" aria-live="polite">
        <div class="status-center">
            <span class="server-status-name">Nombre de la instancia</span>
            <span class="separator">|</span>
            <span class="server-players">0 jugadores</span>
        </div>
    </div>

    <!-- SHELL: contenido + rail perfectamente alineados -->
    <div class="shell">
        <!-- CONTENIDO -->
        <main class="mainpanes">
            <!-- HOME -->
            <section class="pane pane--home is-active" id="pane-home" aria-labelledby="pane-home-title">
                <div class="surface">
                    <!-- HERO (la imagen se setea por JS: this.$.instanceHero.style.backgroundImage = url(...)) -->
                    <div class="instance-hero" role="img" aria-label="Instancia seleccionada">
                        <div class="instance-hero__content">
                            <div class="instance-hero__name" id="pane-home-title">Nombre de la instancia</div>
                            <div class="instance-hero__meta">
                                <span class="chip chip--loader">Loader</span>
                                <span class="chip chip--version">Versión</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- INSTANCIAS -->
            <section class="pane pane--instances" id="pane-instances" aria-labelledby="pane-instances-title" hidden>
                <div class="surface">
                    <div class="pane-head">
                        <div class="pane-head-text">
                            <h2 class="pane-title" id="pane-instances-title">Instancias <span>disponibles</span></h2>
                            <div class="pane-sub">Elige tu ruta y zarpa</div>
                        </div>
                        <label class="instances-search">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle>
                                <path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                            </svg>
                            <input type="text" class="instances-search-input" placeholder="Buscar instancia…" autocomplete="off" />
                        </label>
                    </div>

                    <div class="cards-grid instances-List content-scroll" role="listbox" aria-label="Instancias disponibles"></div>
                </div>
            </section>
        </main>

        <!-- COLUMNA DE SEPARACIÓN -->
        <div class="shell-gap" aria-hidden="true"></div>

        <!-- RAIL DERECHO -->
        <nav class="rail" aria-label="Navegación secundaria">
            <div class="rail__track"></div>

            <button class="rail-btn is-active" data-target="pane-home" aria-label="Inicio" title="Inicio">
                <span class="rail-icon rail-icon--home" aria-hidden="true"></span>
            </button>

            <button class="rail-btn" data-target="pane-instances" aria-label="Instancias" title="Instancias">
                <span class="rail-icon rail-icon--instances" aria-hidden="true"></span>
            </button>

            <button class="rail-btn rail-btn--settings" aria-label="Ajustes" title="Ajustes" data-open-settings>
                <span class="rail-icon rail-icon--profile" aria-hidden="true"></span>
            </button>
        </nav>
    </div>

    <!-- FOOTER -->
    <div class="sidebar" role="toolbar">
        <div class="player-slot">
            <div class="player-head" aria-label="Avatar del jugador"></div>
            <div class="player-meta">
                <div class="player-nick">Jugador</div>
                <div class="player-sub">Conectado</div>
            </div>
        </div>

        <div class="play-zone">
            <!-- Botón normal -->
            <button class="play-btn" aria-label="Iniciar">Iniciar</button>

            <!-- Estado de descarga GLOBAL (se muestra durante el launch) -->
            <div class="info-starting-game" aria-live="polite" style="display:none;">
                <div class="info-starting-game-text">Conectando…</div>
                <progress value="0" max="0" class="progress-bar"></progress>
            </div>
        </div>
    </div>
</div>
