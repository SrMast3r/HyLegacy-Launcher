<div class="login">
    <div class="container">
        <!-- Microsoft / Online -->
        <section class="login-tabs login-home is-active" role="form" aria-labelledby="lh-title">
            <h2 class="login-text" id="lh-title">Inicia sesión para jugar</h2>
            <div class="login-options">
                <button class="connect connect-home">Conectar</button>
                <button class="cancel cancel-home" style="display:none;">Cancelar</button>
            </div>
        </section>

        <!-- Offline -->
        <section class="login-tabs login-offline" role="form" aria-labelledby="lo-title">
            <h2 class="login-text" id="lo-title">Ingresa tu apodo</h2>
            <div class="input-login">
                <input type="text" class="email email-offline" placeholder="Apodo" />
            </div>
            <div class="login-options">
                <button class="connect connect-offline">Conectar</button>
                <button class="cancel cancel-offline" style="display:none;">Cancelar</button>
            </div>
        </section>

        <!-- AZauth -->
        <section class="login-tabs login-AZauth" role="form" aria-labelledby="la-title">
            <h2 class="login-text" id="la-title">Conéctate para continuar</h2>
            <div class="input-login">
                <input type="text" class="email email-AZauth" placeholder="Correo electrónico" />
                <input type="password" class="password password-AZauth" placeholder="Contraseña" />
            </div>
            <div class="login-options">
                <button class="connect connect-AZauth">Conectar</button>
                <button class="cancel cancel-AZauth" style="display:none;">Cancelar</button>
            </div>
        </section>

        <!-- AZauth 2FA -->
        <section class="login-tabs login-AZauth-A2F" role="form" aria-labelledby="l2-title">
            <h2 class="login-text" id="l2-title">Ingresa el código de seguridad</h2>
            <div class="input-login">
                <input type="text" class="A2F A2F-AZauth" placeholder="Código" />
            </div>
            <div class="login-options">
                <button class="connect connect-AZauth-A2F">Validar</button>
                <button class="cancel cancel-AZauth-A2F">Cancelar</button>
            </div>
        </section>
    </div>
</div>
