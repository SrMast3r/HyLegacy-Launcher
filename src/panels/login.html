<!-- Panel de login: se inserta dentro de launcher.html (CSS en assets/css/panels/login.css) -->
<!-- Fondo decorativo igual al splash -->
<div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="grid"></div>
</div>

<main class="login">
    <div class="container">

        <!-- HOME -->
        <section class="login-tabs login-home is-active" aria-label="Inicio de sesión Microsoft">
            <img src="./assets/images/logo.png" alt="Logo HyLegacy" class="login-logo" draggable="false" />
            <h1 class="login-text">HyLegacy Launcher</h1>

            <div class="input-login">
                <button class="connect connect-home" type="button">Conectar con Microsoft</button>
                <button class="cancel cancel-home" type="button">Configurar</button>
            </div>

            <div class="login-options">
                <button class="cancel" type="button" data-view=".login-offline">Modo Offline (No Premium)</button>
                <button class="cancel login-azauth-option" type="button" data-view=".login-AZauth" style="display:none">AZauth</button>
            </div>
        </section>

        <!-- OFFLINE -->
        <section class="login-tabs login-offline">
            <img src="./assets/images/logo.png" alt="Logo HyLegacy" class="login-logo" draggable="false" />
            <h1 class="login-text">Modo Offline</h1>
            <div class="input-login">
                <input class="email email-offline" type="text" placeholder="Apodo (mín. 3 letras)" />
                <button class="connect connect-offline" type="button">Entrar</button>
                <button class="cancel" type="button" data-view=".login-home">Volver</button>
            </div>
        </section>

        <!-- AZAUTH -->
        <section class="login-tabs login-AZauth">
            <img src="./assets/images/logo.png" alt="Logo HyLegacy" class="login-logo" draggable="false" />
            <h1 class="login-text">AZauth</h1>
            <div class="input-login">
                <input class="email email-AZauth" type="email" placeholder="Correo" />
                <input class="password password-AZauth" type="password" placeholder="Contraseña" />
                <button class="connect connect-AZauth" type="button">Conectar</button>
                <button class="cancel" type="button" data-view=".login-home">Volver</button>
            </div>
        </section>

        <!-- AZAUTH 2FA -->
        <section class="login-tabs login-AZauth-A2F">
            <img src="./assets/images/logo.png" alt="Logo HyLegacy" class="login-logo" draggable="false" />
            <h1 class="login-text">Verificación 2FA</h1>
            <div class="input-login">
                <input class="A2F A2F-AZauth" type="text" placeholder="Código de seguridad" inputmode="numeric" />
                <button class="connect connect-AZauth-A2F" type="button">Confirmar</button>
                <button class="cancel cancel-AZauth-A2F" type="button">Cancelar</button>
            </div>
        </section>

    </div>
</main>
