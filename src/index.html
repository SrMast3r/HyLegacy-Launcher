<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8" />
    <!-- CSP ajustada -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                 script-src 'self';
                 img-src 'self' data:;
                 style-src 'self' 'unsafe-inline';
                 connect-src 'self' https://api.github.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyLegacy — Inicio</title>
    <link rel="stylesheet" href="assets/css/index.css" />
</head>
<body class="global">
<!-- Splash a pantalla completa -->
<main id="splash" class="splash" hidden>
    <section class="card" role="status" aria-live="polite" aria-atomic="true">
        <img class="logo" src="./assets/images/logo.png" alt="Logo HyLegacy" draggable="false" />

        <div class="text">
            <h1 class="headline">HyLegacy Launcher</h1>
            <p id="statusMessage" class="status">Buscando actualización…</p>
            <p class="substatus">Todo es automático — no tienes que hacer nada.</p>
        </div>

        <!-- Sin botón: la descarga e instalación son 100% automáticas
             (autoDownload + quitAndInstall silencioso, ver app.js). -->
        <div class="progress-wrap" aria-hidden="true">
            <progress id="progressBar" class="progress" value="0" max="0" aria-label="Progreso de descarga"></progress>
            <span id="progressLabel" class="progress-label"></span>
        </div>

        <p class="footnote">© HyLegacy • Hecho con ❤️</p>
    </section>
</main>

<script src="assets/js/index.js" type="module"></script>
</body>
</html>
